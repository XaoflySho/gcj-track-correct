<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>轨迹纠偏</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin="" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="panel">
    <div class="panel-top">
      <h1>轨迹纠偏</h1>
      <p class="privacy">文件仅在本机处理，不会上传。</p>

      <div class="row">
        <label for="fileInput">一生足迹 CSV</label>
        <input type="file" id="fileInput" accept=".csv,text/csv" />
        <div class="file-name" id="fileName">未选择</div>
      </div>

      <label class="check">
        <input type="checkbox" id="noDedupe" />
        不去重（保留转换后几乎重合的点）
      </label>

      <div class="actions">
        <button type="button" class="primary" id="btnCorrect" disabled>开始纠偏</button>
        <button type="button" class="secondary" id="btnCsv" disabled>下载纠偏 CSV</button>
        <button type="button" class="secondary" id="btnReport" disabled>下载报告</button>
      </div>

      <div id="status">请选择一生足迹导出的 CSV，然后点击「开始纠偏」。</div>
    </div>
    <div class="panel-body">
    <div id="stats" class="stats hidden"></div>
    <div id="tables"></div>

    <div id="previewBlock" class="hidden">
      <div class="section-title">地图预览</div>
      <div class="row">
        <label>开始（CST）</label>
        <div class="dt-row">
          <div class="date-field">
            <label for="dateFrom">日期</label>
            <input type="date" id="dateFrom" />
          </div>
          <div class="time-field">
            <label for="clockFrom">时分（可选）</label>
            <input type="time" id="clockFrom" step="60" />
          </div>
        </div>
        <div class="hint">不填时分则从当天 00:00 起</div>
      </div>
      <div class="row">
        <label>结束（CST）</label>
        <div class="dt-row">
          <div class="date-field">
            <label for="dateTo">日期</label>
            <input type="date" id="dateTo" />
          </div>
          <div class="time-field">
            <label for="clockTo">时分（可选）</label>
            <input type="time" id="clockTo" step="60" />
          </div>
        </div>
        <div class="hint">不填时分则到当天 23:59；跨度 ≤ 31 天</div>
      </div>
      <div class="actions">
        <button type="button" class="primary" id="btnShow">显示</button>
      </div>
      <div class="legend">
        <div class="legend-row"><span class="swatch" style="background:#888;opacity:0.7"></span>原始轨迹</div>
        <div class="legend-row"><span class="swatch" style="background:#1a73e8"></span>纠偏轨迹</div>
        <div class="legend-row"><span class="dot" style="background:#f09000"></span>改动点（≥5 m）</div>
        <div class="legend-row"><span class="dot hollow"></span>删除点（近重复去除）</div>
        <p class="note">底图 OpenStreetMap（WGS-84）。请勿用高德/腾讯底图直接贴 WGS 点。</p>
      </div>
    </div>
    </div>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
